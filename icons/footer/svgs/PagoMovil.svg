<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <g fill="none" fill-rule="evenodd">
    <!-- Phone body -->
    <rect x="2" y="4" width="18" height="32" rx="3.5" stroke="#7C3AED" stroke-width="2.5"/>
    <line x1="2" y1="9" x2="20" y2="9" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- Home button -->
    <circle cx="11" cy="31" r="1.5" fill="#7C3AED"/>
    <!-- Speaker -->
    <line x1="9" y1="6.5" x2="13" y2="6.5" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Waves/Wireless/NFC Signal -->
    <path d="M25 14 A 8 8 0 0 1 25 26" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <path d="M29 10 A 13 13 0 0 1 29 30" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Text logo -->
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="10.5" fill="#7C3AED" letter-spacing="0.2">PAGO</text>
    <text x="38" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="10.5" fill="#7C3AED" letter-spacing="0.2">MÓVIL</text>
  </g>
</svg>
